<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Page Assistant</title>
  <style>
    body {
      width: 400px;
      padding: 16px;
      font-family: system-ui, -apple-system, Arial, sans-serif;
      margin: 0;
    }
    .container {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    button {
      padding: 8px 16px;
      cursor: pointer;
      background: #1a73e8;
      color: white;
      border: none;
      border-radius: 4px;
      font-weight: 500;
      transition: background 0.2s;
    }
    button:hover {
      background: #1557b0;
    }
    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    textarea {
      width: 100%;
      height: 200px;
      margin: 8px 0;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      resize: vertical;
    }
    input {
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
    }
    .error {
      color: #d93025;
      background: #fce8e6;
      padding: 8px;
      border-radius: 4px;
      margin: 8px 0;
    }
    .loading {
      color: #1a73e8;
      background: #e8f0fe;
      padding: 8px;
      border-radius: 4px;
      margin: 8px 0;
    }
  </style>
  <!-- xlsx will be bundled by webpack -->
</head>
<body>
  <div class="container">
    <button id="extractContent">读取页面内容</button>
    <textarea id="content" placeholder="页面内容将显示在这里..."></textarea>
    <input type="text" id="question" placeholder="输入您的问题..." disabled>
    <button id="askAI" disabled>询问AI</button>
    <button id="exportExcel">导出Excel</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
